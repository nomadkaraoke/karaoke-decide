name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # TESTS (PRs only - main skips to deploy)
  # ============================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run ruff check
        run: poetry run ruff check .

      - name: Run ruff format check
        run: poetry run ruff format --check .

      - name: Run mypy
        run: poetry run mypy karaoke_decide backend --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with vocal-analysis --no-root

      - name: Install project
        run: poetry install --no-interaction --with vocal-analysis

      - name: Run unit tests with coverage
        run: |
          poetry run pytest tests/unit -v --tb=short \
            --cov=karaoke_decide \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: false

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run backend tests with coverage
        run: |
          poetry run pytest backend/tests -v --tb=short \
            --ignore=backend/tests/emulator \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check || echo "type-check script not found, skipping"

      - name: Run tests
        run: npm test || echo "No tests configured yet"

      - name: Build
        run: npm run build

  translation-check:
    name: Translation Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frontend translations (key parity)
        run: |
          python scripts/validate-translations.py --messages-dir frontend/messages --keys-only || echo "::warning::Frontend translation validation failed"
      - name: Validate backend translations (key parity)
        run: python scripts/validate-translations.py --messages-dir backend/translations --keys-only

  # Summary job for branch protection (PRs only)
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-backend, test-frontend, translation-check]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test-unit.result }}" != "success" ]] || \
             [[ "${{ needs.test-backend.result }}" != "success" ]] || \
             [[ "${{ needs.test-frontend.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          # Translation check is warn-only (not blocking)
          if [[ "${{ needs.translation-check.result }}" != "success" ]]; then
            echo "Warning: Translation validation failed (non-blocking)"
          fi
          echo "All required jobs passed!"

  # ============================================
  # DEPLOYMENTS (main branch only)
  # ============================================

  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        # NEXT_PUBLIC_API_URL is intentionally not set - uses relative URLs
        # which are proxied to Cloud Run via Cloudflare Worker
        env:
          # Public web OAuth client (gen's); decide.nomadkaraoke.com is an authorised origin
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 718638054799-fush0smd1e4icq9pt0immp8n59jjlebh.apps.googleusercontent.com
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    name: Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      REGISTRY: us-central1-docker.pkg.dev
      PROJECT_ID: nomadkaraoke
      REPOSITORY: karaoke-repo
      IMAGE_NAME: karaoke-decide
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.2.1"

      - name: Extract version
        id: version
        run: |
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📋 Version: $VERSION"

      - name: Authenticate to Google Cloud (Workload Identity)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "latest"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.IMAGE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --cpu-throttling \
            --cpu-boost \
            --startup-probe httpGet.path=/api/ready,httpGet.port=8000,initialDelaySeconds=0,timeoutSeconds=1,periodSeconds=1,failureThreshold=240 \
            --timeout 1800 \
            --concurrency 80 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "ENVIRONMENT=production,GOOGLE_CLOUD_PROJECT=nomadkaraoke,GOOGLE_CLOUD_PROJECT_NUMBER=718638054799,CLOUD_RUN_URL=https://karaoke-decide-718638054799.us-central1.run.app,FRONTEND_URL=https://decide.nomadkaraoke.com,SPOTIFY_REDIRECT_URI=https://karaoke-decide-718638054799.us-central1.run.app/api/services/spotify/callback,LISTENBRAINZ_OAUTH_ENABLED=true,PUBLIC_API_BASE_URL=https://decide.nomadkaraoke.com,VOICE_DATA_BUCKET=nomadkaraoke-musicbrainz-data,VOICE_RECORDINGS_BUCKET=nomadkaraoke-voice-recordings" \
            --set-secrets "JWT_SECRET=karaoke-decide-jwt-secret:latest,SPOTIFY_CLIENT_ID=spotipy-client-id:latest,SPOTIFY_CLIENT_SECRET=spotipy-client-secret:latest,LASTFM_API_KEY=lastfm-api-key:latest,POSTMARK_SERVER_TOKEN=postmark-server-token:latest,DECIDE_KJBOX_SECRET=decide-kjbox-secret:latest,DECIDE_GEN_PARTNER_SECRET=decide-gen-partner-secret:latest,APPLE_MUSICKIT_PRIVATE_KEY=apple-musickit-private-key:latest,APPLE_MUSICKIT_KEY_ID=apple-musickit-key-id:latest,APPLE_TEAM_ID=apple-team-id:latest,GEMINI_API_KEY=gemini-api-key:latest,METABRAINZ_CLIENT_ID=metabrainz-client-id:latest,METABRAINZ_CLIENT_SECRET=metabrainz-client-secret:latest,DECIDE_TOKEN_KEY=decide-token-key:latest,ADMIN_TOKENS=admin-tokens:latest"

      - name: Update mb-refresh job image
        # Cloud Run Jobs resolve the image at update time, not per execution, so
        # pin the weekly MusicBrainz refresh job to the image just deployed.
        # The job itself is defined in infrastructure/ (Pulumi ignores image drift).
        run: |
          gcloud run jobs update mb-refresh \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Update lb-refresh job image
        # Same as mb-refresh: pin the ListenBrainz refresh job to the deployed image.
        run: |
          gcloud run jobs update lb-refresh \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Update lb-poll job image
        # Same as mb-refresh: pin the daily ListenBrainz poll job to the deployed image.
        # Pulumi creates the job; until it exists this step is skipped so later deploy steps still run.
        run: |
          if ! out=$(gcloud run jobs describe lb-poll --region ${{ env.REGION }} 2>&1); then
            if echo "$out" | grep -qE "Cannot find (service|job)"; then
              echo "::warning::lb-poll does not exist yet (created by Pulumi); skipping"
              exit 0
            fi
            echo "$out"; exit 1
          fi
          gcloud run jobs update lb-poll \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Update voice-pool-select job image
        id: voice_pool_select_update
        # Non-critical: never skip the later deploy/verify steps.
        continue-on-error: true
        # Same as lb-poll: pin the on-demand voice-pool selection job to the deployed image (skipped until Pulumi creates it).
        run: |
          if ! out=$(gcloud run jobs describe voice-pool-select --region ${{ env.REGION }} 2>&1); then
            if echo "$out" | grep -qE "Cannot find (service|job)"; then
              echo "::warning::voice-pool-select does not exist yet (created by Pulumi); skipping"
              exit 0
            fi
            echo "$out"; exit 1
          fi
          gcloud run jobs update voice-pool-select \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Update voice-pool-fetch job image
        id: voice_pool_fetch_update
        # Non-critical: never skip the later deploy/verify steps.
        continue-on-error: true
        # Same as lb-poll: pin the hourly voice-pool fetch job to the deployed image (skipped until Pulumi creates it).
        run: |
          if ! out=$(gcloud run jobs describe voice-pool-fetch --region ${{ env.REGION }} 2>&1); then
            if echo "$out" | grep -qE "Cannot find (service|job)"; then
              echo "::warning::voice-pool-fetch does not exist yet (created by Pulumi); skipping"
              exit 0
            fi
            echo "$out"; exit 1
          fi
          gcloud run jobs update voice-pool-fetch \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Warn if voice-pool job image updates failed
        if: steps.voice_pool_select_update.outcome == 'failure' || steps.voice_pool_fetch_update.outcome == 'failure'
        run: echo "::warning::voice-pool-select / voice-pool-fetch image update failed (non-blocking; prod deploy unaffected)"

      - name: Deploy search service
        # Same image, different command. Settings must match infrastructure/__main__.py
        # (tests/unit/test_infra_ci_parity.py). --update-env-vars/--update-secrets merge
        # into the live env: the song-index-build job owns the index-run variable and a
        # deploy must keep it (never use --set-env-vars here).
        # Pulumi creates the service once an index exists (docs/ARCHITECTURE.md
        # § Song search); until then this step is skipped.
        run: |
          if ! out=$(gcloud run services describe karaoke-decide-search --region ${{ env.REGION }} 2>&1); then
            if echo "$out" | grep -qE "Cannot find (service|job)"; then
              echo "::warning::karaoke-decide-search does not exist yet (created by Pulumi); skipping its deploy"
              exit 0
            fi
            echo "$out"; exit 1
          fi
          gcloud run deploy karaoke-decide-search \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account song-search@nomadkaraoke.iam.gserviceaccount.com \
            --memory 4Gi \
            --cpu 1 \
            --cpu-throttling \
            --cpu-boost \
            --concurrency 80 \
            --max-instances 3 \
            --min-instances 0 \
            --port 8000 \
            --command uvicorn \
            --args backend.search.app:search_app,--host,0.0.0.0,--port,8000 \
            --startup-probe httpGet.path=/api/search/ready,httpGet.port=8000,timeoutSeconds=5,periodSeconds=10,failureThreshold=24 \
            --update-env-vars "SONG_INDEX_BUCKET=nomadkaraoke-kn-data,SONG_INDEX_OFFLINE_URL_TEMPLATE=https://decide.nomadkaraoke.com/offline-index/{run}/offline.db.gz,GEN_API_URL=https://api.nomadkaraoke.com" \
            --update-secrets "DECIDE_GEN_PARTNER_SECRET=decide-gen-partner-secret:latest"

      - name: Update song-index-build job image
        # Same as mb-refresh: pin the daily index build job to the deployed image.
        run: |
          if ! out=$(gcloud run jobs describe song-index-build --region ${{ env.REGION }} 2>&1); then
            if echo "$out" | grep -qE "Cannot find (service|job)"; then
              echo "::warning::song-index-build does not exist yet (created by Pulumi); skipping"
              exit 0
            fi
            echo "$out"; exit 1
          fi
          gcloud run jobs update song-index-build \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Build and push vocal-analysis image
        id: vocal_build
        # Non-critical: prod is already updated by now, so never fail the deploy job.
        continue-on-error: true
        # On-demand vocal-range-gen job image: main image + librosa/soundfile/ffmpeg.
        run: |
          VOCAL_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/karaoke-decide-vocal
          docker buildx build -f Dockerfile.vocal-analysis --push --provenance=false \
            --build-arg BASE_IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t $VOCAL_IMAGE:${{ github.sha }} -t $VOCAL_IMAGE:latest .

      - name: Update vocal-range-gen job image
        id: vocal_update
        if: steps.vocal_build.outcome == 'success'
        continue-on-error: true
        run: |
          if ! out=$(gcloud run jobs describe vocal-range-gen --region ${{ env.REGION }} 2>&1); then
            if echo "$out" | grep -qE "Cannot find (service|job)"; then
              echo "::warning::vocal-range-gen does not exist yet (created by Pulumi); skipping"
              exit 0
            fi
            echo "$out"; exit 1
          fi
          gcloud run jobs update vocal-range-gen \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/karaoke-decide-vocal:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Update voice-pool-analyse job image
        id: voice_analyse_update
        # Same vocal-analysis image as vocal-range-gen; non-critical, skipped until Pulumi creates the job.
        if: steps.vocal_build.outcome == 'success'
        continue-on-error: true
        run: |
          if ! out=$(gcloud run jobs describe voice-pool-analyse --region ${{ env.REGION }} 2>&1); then
            if echo "$out" | grep -qE "Cannot find (service|job)"; then
              echo "::warning::voice-pool-analyse does not exist yet (created by Pulumi); skipping"
              exit 0
            fi
            echo "$out"; exit 1
          fi
          gcloud run jobs update voice-pool-analyse \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/karaoke-decide-vocal:${{ github.sha }} \
            --region ${{ env.REGION }}

      - name: Warn if vocal-analysis image steps failed
        if: steps.vocal_build.outcome == 'failure' || steps.vocal_update.outcome == 'failure' || steps.voice_analyse_update.outcome == 'failure'
        run: echo "::warning::vocal-analysis image build or vocal-range-gen / voice-pool-analyse update failed (non-blocking; prod deploy unaffected)"

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.IMAGE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')

          echo "Service URL: $SERVICE_URL"
          echo "Waiting for deployment to stabilize..."
          sleep 10

          # Health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Deployment successful! Health check passed."
          else
            echo "❌ Health check failed with status: $HTTP_STATUS"
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          echo "🎉 Backend deployment successful!"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  e2e-smoke:
    name: E2E Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    # Run after deployments complete on main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        run: |
          cd frontend
          npx playwright test --project=chromium e2e/smoke.spec.ts || echo "No smoke tests yet"
        env:
          BASE_URL: https://decide.nomadkaraoke.com
