name: Run catalog build

# Manual trigger for the first catalog.db build (or an ad-hoc rebuild) without waiting
# for the Sunday mb-refresh run. Runs `mb-refresh catalog` (build + gate + publish only,
# no dump refresh) and waits for it. Uses the same Workload Identity auth as the deploy job.

on:
  workflow_dispatch:
    inputs:
      skip_vocal_range:
        description: "Pass --skip-vocal-range (catalog runs the vocal-range step first; skip it if the 60 min timeout is tight)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  catalog-build:
    name: mb-refresh catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Authenticate to Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute mb-refresh catalog and wait
        run: |
          gcloud run jobs execute mb-refresh \
            --region us-central1 \
            --args=${{ inputs.skip_vocal_range && 'catalog,--skip-vocal-range' || 'catalog' }} \
            --wait
